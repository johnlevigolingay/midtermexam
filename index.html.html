<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Cars</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white p-4 border border-blue-500">
        <div class="flex justify-center mb-4">
            <img alt="Corvette" class="w-1000 h-80 border border-gray-300" src="corvette.jpg" />
        </div>
        <div class="text-center mb-4">
            <p class="text-lg font-bold">SPORTS CARS</p>
        </div>
        <div class="grid grid-cols-5 gap-2">
            <div class="flex flex-col items-center">
                <img alt="Porsche" class="w-16 h-16 border border-black-300" src="porsche.jpg" />
                <p class="text-xs">Porsche</p>
            </div>
            <div class="flex flex-col items-center">
                <img alt="BMW" class="w-16 h-16 border border-gray-300" src="bmwz4.jpg" />
                <p class="text-xs">BMW</p>
            </div>
            <div class="flex flex-col items-center">
                <img alt="Toyota Supra" class="w-16 h-16 border border-gray-300" src="supra.jpg" />
                <p class="text-xs">Toyota Supra</p>
            </div>
            <div class="flex flex-col items-center">
                <img alt="LEXUS LC" class="w-16 h-16 border border-gray-300" src="lexus.jpg" />
                <p class="text-xs">LEXUS LC</p>
            </div>
            <div class="flex flex-col items-center">
                <img alt="Mercedes-Benz GT" class="w-16 h-16 border border-gray-300" src="mercedes.jpg" />
                <p class="text-xs">Mercedes-Benz GT</p>
            </div>
            <div class="flex flex-col items-center">
                <img alt="NISSAN GTR" class="w-16 h-16 border border-gray-300" src="nissan.jpg" />
                <p class="text-xs">NISSAN GTR</p>
            </div>
            <div class="flex flex-col items-center">
                <img alt="Jaguar F-Type" class="w-16 h-16 border border-gray-300" src="jaguar.jpg" />
                <p class="text-xs">Jaguar F-Type</p>
            </div>
            <div class="flex flex-col items-center">
                <img alt="Honda Accord" class="w-16 h-16 border border-gray-300" src="honda.jpg" />
                <p class="text-xs">Honda Accord</p>
            </div>
            <div class="flex flex-col items-center">
                <img alt="Honda Civic" class="w-16 h-16 border border-gray-300" src="civic.jpg" />
                <p class="text-xs">Honda Civic</p>
            </div>
            <div class="flex flex-col items-center">
                <img alt="Ford Mustang" class="w-16 h-16 border border-gray-300" src="ford.jpg" />
                <p class="text-xs">Ford Mustang</p>
            </div>
        </div>
    </div>
</body>
</html>
